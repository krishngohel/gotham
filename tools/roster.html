<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Character roster</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a2436; color: #e9e2cf; font: 12px/1.35 monospace; overflow: hidden; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; top: 8px; left: 8px; width: 270px; max-height: calc(100% - 16px); overflow: auto; background: rgba(11, 11, 18, 0.82); padding: 8px; border: 2px solid #0b0b12; }
    #ui.hidden { display: none; }
    #ui h1 { font-size: 14px; margin: 0 0 6px; }
    #ui h2 { font-size: 12px; margin: 8px 0 2px; color: #f2d24b; text-transform: uppercase; }
    #ui button { display: block; width: 100%; text-align: left; background: none; color: inherit; border: 0; padding: 2px 4px; font: inherit; cursor: pointer; }
    #ui button.on { background: #f2d24b; color: #0b0b12; }
    #ui select, #ui label { display: block; margin: 4px 0; width: 100%; }
    #stats { position: fixed; right: 8px; top: 8px; background: rgba(11, 11, 18, 0.82); padding: 6px 8px; white-space: pre; }
    #stats.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="ui">
    <h1>Roster (toon + ink)</h1>
    <label>Clip <select id="clip"></select></label>
    <label>View <select id="view"><option>turntable</option><option>front</option><option>quarter</option><option>side</option><option>back</option><option>game8m</option><option>far20m</option><option>face</option></select></label>
    <label><input type="checkbox" id="lineup"> Line-up of the group</label>
    <div id="list"></div>
  </div>
  <div id="stats"></div>
  <script type="module" src="./roster.js"></script>
</body>
</html>
